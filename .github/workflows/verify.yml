name: verify conjecture results
on:
  push:
  pull_request:
concurrency:
  group: computational-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing Baricz–Pogány formal-series identities
        run: python results/baricz-pogany-coefficients/verify.py
      - name: Check Malek transform scalar identities
        run: python results/malek-subpermanent/verify.py
      - name: Check permanental-compound trace and support identities
        run: python results/perron-root-permanental-compounds/verify.py
      - name: Check Bessel-ratio Wronskian identities and endpoint terms
        run: python results/kvz-bessel-unimodality/verify.py
      - name: Check Wright disproof curvature identities
        run: python results/ferreira-simon-wright/verify.py
      - name: Check gamma-quotient signs, rank, and moment normalization
        run: python results/kvz-gamma-quotient/verify.py
      - name: Check Fuss–Catalan path conventions and exact formula
        run: python results/alexandersson-fuss-catalan/verify.py
      - name: Check Sagan–Swanson exact conditional probability models
        run: python results/sagan-swanson-normality/verify_model.py
      - name: Check Bernardi–Morales determinant and tree identities
        run: |
          python results/bernardi-morales-delta/verify.py
          python results/bernardi-morales-delta/verify_events.py
      - name: Check Gilmore and Chow polynomial conjectures
        run: |
          python -m pip install sympy==1.14.0
          python results/gilmore-crossing-nesting/verify.py
          python results/chow-conjecture/verify.py
      - name: Check Pula–Song–Wanless identities and parameter conventions
        run: python results/pula-song-wanless/verify.py
      - name: Verify partial results at Hadamard order 2396
        working-directory: results/hadamard-2396
        run: |
          python -m pip install numpy==2.2.6
          c++ -O2 -std=c++17 quotient133.cpp -o "$RUNNER_TEMP/hadamard133"
          "$RUNNER_TEMP/hadamard133" > "$RUNNER_TEMP/hadamard133.pairs"
          diff -u quotient133.pairs "$RUNNER_TEMP/hadamard133.pairs"
          python audit.py
          python border.py
          python automorphisms.py
      - name: Verify partial results for Frankl, Lonely Runner and Erdős–Gyárfás
        run: |
          python -m pip install scipy==1.15.3
          python results/frankl-generator-families/span_four.py
          python results/frankl-generator-families/tree_messages.py
          python results/frankl-generator-families/message_audit.py
          python results/lonely-runner-two-insertions/two_additions.py
          python results/erdos-gyarfas-abelian-covers/verify.py
          python results/erdos-gyarfas-abelian-covers/sharpness.py
      - name: Check conditional lonely-runner examples
        run: python3 results/loneliness-on-a-hyperplane/verify.py
      - name: Check divisor-sum congruences and cofactor identities
        run: python3 results/erdos-granville-pomerance-spiro/verify.py
      - name: Check Horňák–Woźniak partition allocations
        run: python3 results/hornak-wozniak/verify.py
      - name: Check Sonntag–Teichert domination hypergraphs
        run: python3 results/sonntag-teichert/verify.py
      - name: Check finite prime-order circulant permanent examples
        run: python3 docs/nss/sanity_check.py --output "$RUNNER_TEMP/nss-sanity-results.json"
      - name: Verify L-solitaire exhaustive finite checks
        run: python3 results/l-solitaire-limit-shapes/verify.py
      - name: Verify Pham exact main and dual certificates
        run: |
          python3 results/pham-denominator-degree/verify.py
          python3 results/pham-denominator-degree/verify.py --dual --brute-depth 13
      - name: Run Pham regression tests
        run: cd results/pham-denominator-degree && python3 -m unittest discover -s tests -v
      - name: Verify Graffiti.pc 318 total-domination theorem
        run: python3 results/graffiti-pc-318/verify.py
      - name: Verify Li non-spider coefficient and partition certificates
        run: |
          python3 results/li-coefficient-sign/verify.py
          python3 results/li-coefficient-sign/independent_check.py
      - name: Verify Batista Egyptian-fraction congruence checks
        run: python3 results/batista-egyptian-fractions/verify.py
      - name: Verify the line-size generating function
        run: python3 results/erdos-607-line-sizes/verify.py
      - name: Verify rectangle packing and multiset recovery
        run: python3 results/rectangle-partition-asymptotics/verify.py
      - name: Replay standard three-player War deals
        run: python3 results/spivey-multiplayer-war/verify.py
      - name: Check the CUT Family B threshold against the game rules
        run: python3 results/cut-family-b/verify.py
      - name: Prove the two ultimate CUT periods by automata
        run: python3 results/cut-arithmetic-periodicity/verify.py
      - name: Reproduce the compact CUT Lean certificate tables
        run: |
          python3 results/cut-arithmetic-periodicity/generate_weight_certificates.py --output-dir "$RUNNER_TEMP/cut-weight"
          diff -u lean/Conjectures/CutPeriodWeightTables.lean "$RUNNER_TEMP/cut-weight/CutPeriodWeightTables.lean"
          diff -u lean/Conjectures/CutPeriodWeightCoverTables.lean "$RUNNER_TEMP/cut-weight/CutPeriodWeightCoverTables.lean"
      - name: Verify both distance-graph density results
        run: |
          c++ -std=c++20 -O3 results/distance-graph-densities/verify.cpp -o /tmp/verify-distance-graphs
          /tmp/verify-distance-graphs
          python3 results/distance-graph-densities/counterexample.py
      - name: Verify the Oravcová–Soták distance-graph classification
        run: python3 results/oravcova-sotak/verify.py
      - name: Check the Johnson–Kaya–Matzke path spectra
        run: python3 results/babai-spectrum-paths/verify.py
      - name: Check the two-difference Motzkin formula
        run: python3 results/two-difference-motzkin/verify.py
      - name: Check the symmetric four-point packing and covering theorem
        run: python3 results/symmetric-four-point-density/verify.py
      - name: Check the nonmixed-gap packing theorem
        run: python3 results/nonmixed-gap-packing/verify.py
      - name: Check Haralambis three-difference rotation certificates
        run: python3 results/haralambis-three-differences/verify.py
      - name: Verify the five-speed loneliness spectrum
        run: python3 results/five-speed-spectrum/verify.py
      - name: Verify tight six-speed sets and seven-coordinate critical planes
        run: python3 results/tight-six-speeds/verify.py
      - name: Verify the six-speed loneliness spectrum
        run: python3 results/six-speed-spectrum/verify.py
      - name: Verify all equality cases for eight lonely runners
        run: python3 results/tight-seven-speeds/verify.py
      - name: Verify the unique equality case for nine lonely runners
        run: python3 results/tight-eight-speeds/verify.py
      - name: Verify the unique equality case for ten lonely runners
        run: python3 results/tight-nine-speeds/verify.py
      - name: Verify Zhang's lonely-runner deletion values
        run: python3 results/zhang-deletion-values/verify.py
      - name: Verify the seven-speed loneliness spectrum
        run: python3 results/seven-speed-spectrum/verify.py
      - name: Verify the eight-speed loneliness spectrum
        run: python3 results/eight-speed-spectrum/verify.py
      - name: Verify eleven- through fourteen-runner equality cases
        run: |
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/vzsky/13-lonely-runners/29311663c21835d67529b29a4acf6631fcad5c63/result_12 -o "$RUNNER_TEMP/first-lifts.log"
          python3 results/tight-eleven-to-fourteen/verify.py --legacy-log "$RUNNER_TEMP/first-lifts.log"

